<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="100%" height="100%" viewBox="0 0 1920 1080">
  <foreignObject width="100%" height="100%" x="0" y="0">
    <xhtml:html xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;margin:0;padding:0;">
      <xhtml:head>
        <xhtml:style>
          html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
          }
          iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
          }
        </xhtml:style>
      </xhtml:head>
      <xhtml:body>
        <xhtml:iframe 
          src="https://unpkg.com/snoopylearning@latest/dist/index.html" 
          allowfullscreen
          allow="fullscreen">
        </xhtml:iframe>
      </xhtml:body>
    </xhtml:html>
  </foreignObject>
</svg>
